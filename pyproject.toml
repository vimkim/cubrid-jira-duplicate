[project]
name = "cubrid-jira-duplicate-poc"
version = "0.1.0"
description = "PoC for a CBRD duplicate-issue checker: measurements and the package it grows into."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "tenacity>=9.1",
    "typer>=0.16",
]

[project.scripts]
cbrd-dup = "cbrd_dup.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cbrd_dup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
