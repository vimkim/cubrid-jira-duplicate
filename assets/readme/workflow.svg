<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">CBRD 이슈에서 중복·관련 후보 찾기</title>
  <desc id="desc">초안이나 기존 이슈를 로컬 BM25와 다국어 임베딩으로 검색한다. CBRD-27944의 실제 예시에서는 CBRD-27945, CBRD-27925, CBRD-27872가 상위 후보로 나온다. 중복 판정은 사람이나 LLM이 맡는다.</desc>
  <rect width="1200" height="420" rx="16" fill="#F4F2E9"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK KR', sans-serif">
    <g id="heading" fill="#192D28">
      <text x="56" y="57" font-size="20" font-weight="600" letter-spacing="2">CUBRID JIRA / CBRD</text>
      <text x="56" y="121" font-size="52" font-weight="750">초안에서 기존 이슈까지.</text>
      <text x="1144" y="55" text-anchor="end" font-size="20" fill="#64766C">CANDIDATE RETRIEVAL</text>
    </g>
    <g id="input">
      <text x="56" y="181" font-size="26" fill="#64766C">01 / 입력</text>
      <text x="56" y="235" font-size="38" font-weight="650" fill="#192D28" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">CBRD-27944</text>
      <text x="56" y="278" font-size="24" fill="#64766C">초안 · 이슈 키 · 제목과 본문</text>
    </g>
    <g id="retrieval">
      <text x="440" y="181" font-size="26" fill="#64766C">02 / 로컬 검색</text>
      <text x="440" y="231" font-size="34" font-weight="650" fill="#386A55">BM25 + 임베딩</text>
      <text x="440" y="273" font-size="24" fill="#64766C">제목 · 본문 · 댓글 · 스택</text>
      <g fill="#386A55">
        <rect x="440" y="293" width="48" height="7" rx="3"/>
        <rect x="496" y="293" width="24" height="7" rx="3"/>
        <rect x="528" y="293" width="24" height="7" rx="3"/>
        <rect x="560" y="293" width="24" height="7" rx="3"/>
        <rect x="592" y="293" width="96" height="7" rx="3"/>
      </g>
    </g>
    <g id="ranked-candidates">
      <text x="848" y="181" font-size="26" fill="#64766C">03 / 후보 제안</text>
      <g font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="32" fill="#192D28">
        <text x="848" y="226"><tspan fill="#C66246">1</tspan><tspan dx="20">CBRD-27945</tspan></text>
        <text x="848" y="267"><tspan fill="#64766C">2</tspan><tspan dx="20">CBRD-27925</tspan></text>
        <text x="848" y="308"><tspan fill="#64766C">3</tspan><tspan dx="20">CBRD-27872</tspan></text>
      </g>
    </g>
    <g id="connections" stroke="#386A55" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M352 227H402m-9-9 9 9-9 9"/>
      <path d="M744 227H810m-9-9 9 9-9 9"/>
    </g>
    <path d="M56 340H1144" stroke="#64766C" stroke-opacity=".25"/>
    <text x="56" y="384" font-size="24" fill="#386A55">CPU 실행 · 로컬 임베딩 · JIRA 읽기 전용</text>
    <text x="1144" y="384" text-anchor="end" font-size="24" font-weight="600" fill="#192D28">최종 판정은 사람이나 LLM이.</text>
  </g>
</svg>
